name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Generate temporary release signing key
        run: keytool -genkeypair -v -keystore android/ghostchat-release.keystore -storepass ghostchat-release -keypass ghostchat-release -alias ghostchat -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GhostChat, OU=Mobile, O=GhostChat, L=Jakarta, ST=DKI Jakarta, C=ID"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/ghostchat-release.keystore -Pandroid.injected.signing.store.password=ghostchat-release -Pandroid.injected.signing.key.alias=ghostchat -Pandroid.injected.signing.key.password=ghostchat-release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostchat-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release for tag builds
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
